<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Smart Campus ERP</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body data-role="admin,faculty,student">
    <div class="dashboard-container">

        <div id="sidebar"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>Change Password</h1>
                    <p>Apna login password badlo</p>
                </div>
                <div class="profile" id="userName">User</div>
            </header>

            <section class="section">
                <h2>Naya password set karo</h2>
                <form class="toolbar" id="pwForm">
                    <input id="oldPassword" type="password" placeholder="Purana password" required>
                    <input id="newPassword" type="password" placeholder="Naya password (kam se kam 6)" minlength="6" required>
                    <input id="confirmPassword" type="password" placeholder="Naya password dobara" minlength="6" required>
                    <button class="action-button" type="submit">Password badlo</button>
                </form>
                <p id="msg"></p>
            </section>

        </main>
    </div>

    <script src="layout.js"></script>
    <script>
        function showMessage(text, ok) {
            const msg = document.getElementById("msg");
            msg.style.color = ok ? "#16a34a" : "#dc2626";
            msg.textContent = text;
        }

        document.getElementById("pwForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const form = this;
            const newPassword = document.getElementById("newPassword").value;

            if (newPassword !== document.getElementById("confirmPassword").value) {
                showMessage("Dono naye password same nahi hain.", false);
                return;
            }

            try {
                const res = await fetch("http://127.0.0.1:5001/api/change-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + localStorage.getItem("erpToken")
                    },
                    body: JSON.stringify({
                        old_password: document.getElementById("oldPassword").value,
                        new_password: newPassword
                    })
                });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const data = await res.json();
                if (!data.ok) {
                    showMessage(data.message, false);
                    return;
                }
                showMessage("Password badal gaya. Agli baar naye password se login karna.", true);
                form.reset();
            } catch (err) {
                showMessage("Server se connect nahi ho paya. Backend chalu hai?", false);
            }
        });
    </script>
</body>
</html>
