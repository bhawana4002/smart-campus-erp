<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Results | Smart Campus ERP</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body data-role="student">
    <div class="dashboard-container">

        <div id="sidebar"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>My Results</h1>
                    <p>Subject-wise marks, grade aur CGPA</p>
                </div>
                <div class="profile" id="userName">Student</div>
            </header>

            <section class="cards">
                <div class="dashboard-card">
                    <h3>CGPA</h3>
                    <p class="number" id="cgpa">-</p>
                    <span>10 me se</span>
                </div>
            </section>

            <section class="section">
                <h2>Subject-wise</h2>
                <table>
                    <thead>
                        <tr><th>Subject</th><th>Marks</th><th>Grade</th><th>Grade point</th></tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
                <p class="empty" id="empty" hidden>Abhi koi result nahi aaya hai.</p>
                <p id="info"></p>
            </section>

        </main>
    </div>

    <script src="layout.js"></script>
    <script>
        function esc(t) {
            const d = document.createElement("div");
            d.textContent = t;
            return d.innerHTML;
        }

        async function loadResults() {
            const info = document.getElementById("info");
            try {
                const res = await fetch("http://127.0.0.1:5001/api/my/results", {
                    headers: { "Authorization": "Bearer " + localStorage.getItem("erpToken") }
                });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const data = await res.json();
                if (!data.ok) {
                    info.textContent = data.message;
                    return;
                }

                document.getElementById("cgpa").textContent = data.cgpa === null ? "-" : data.cgpa.toFixed(2);
                document.getElementById("empty").hidden = data.subjects.length > 0;

                document.getElementById("rows").innerHTML = data.subjects.map(function (s) {
                    const color = s.grade === "F" ? "#dc2626" : "#16a34a";
                    return "<tr><td>" + esc(s.subject) + "</td><td>" + s.marks + "/100</td>" +
                        '<td style="color:' + color + '"><b>' + esc(s.grade) + "</b></td><td>" + s.point + "</td></tr>";
                }).join("");
            } catch (err) {
                info.textContent = "Server se connect nahi ho paya. Backend chalu hai?";
            }
        }

        loadResults();
    </script>
</body>
</html>
