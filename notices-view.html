<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notices | Smart Campus ERP</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body data-role="student,faculty">
    <div class="dashboard-container">

        <div id="sidebar"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>Notices</h1>
                    <p>College ke latest notices</p>
                </div>
                <div class="profile" id="userName">User</div>
            </header>

            <section class="section">
                <h2>Latest notices</h2>
                <div id="list"></div>
                <p class="empty" id="empty" hidden>Abhi koi notice nahi hai.</p>
                <p id="info"></p>
            </section>

        </main>
    </div>

    <script src="layout.js"></script>
    <script>
        function esc(t) {
            const d = document.createElement("div");
            d.textContent = t;
            return d.innerHTML;
        }

        async function loadNotices() {
            const info = document.getElementById("info");
            try {
                const res = await fetch("http://127.0.0.1:5001/api/notices", {
                    headers: { "Authorization": "Bearer " + localStorage.getItem("erpToken") }
                });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const list = await res.json();

                document.getElementById("list").innerHTML = list.map(function (n) {
                    return '<div class="notice"><h3>' + esc(n.title) + "</h3><p>" + esc(n.message) + "</p>" +
                        '<p style="margin-top:8px; font-size:13px;">' + esc(n.created_at) + "</p></div>";
                }).join("");
                document.getElementById("empty").hidden = list.length > 0;
            } catch (err) {
                info.textContent = "Server se connect nahi ho paya. Backend chalu hai?";
            }
        }

        loadNotices();
    </script>
</body>
</html>
