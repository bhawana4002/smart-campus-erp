<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Timetable | Smart Campus ERP</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body data-role="faculty">
    <div class="dashboard-container">

        <div id="sidebar"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>My Timetable</h1>
                    <p>Aapki hafte ki saari classes (aaj ki class neele rang me)</p>
                </div>
                <div class="profile" id="userName">Faculty</div>
            </header>

            <section class="section">
                <h2>Weekly timetable</h2>
                <table>
                    <thead>
                        <tr><th>Din</th><th>Time</th><th>Subject</th><th>Course</th><th>Room</th></tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
                <p class="empty" id="empty" hidden>Abhi aapki koi class timetable me set nahi hai.</p>
                <p id="info"></p>
            </section>

        </main>
    </div>

    <script src="layout.js"></script>
    <script>
        function esc(t) {
            const d = document.createElement("div");
            d.textContent = t;
            return d.innerHTML;
        }

        async function loadTimetable() {
            const info = document.getElementById("info");
            try {
                const res = await fetch("http://127.0.0.1:5001/api/my/faculty-timetable", {
                    headers: { "Authorization": "Bearer " + localStorage.getItem("erpToken") }
                });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const data = await res.json();
                if (!data.ok) {
                    info.textContent = data.message;
                    return;
                }

                document.getElementById("rows").innerHTML = data.entries.map(function (e) {
                    const style = e.day === data.today ? ' style="background:#eff6ff"' : "";
                    return "<tr" + style + "><td>" + esc(e.day) + "</td><td>" + esc(e.start_time) + " - " +
                        esc(e.end_time) + "</td><td>" + esc(e.subject) + "</td><td>" + esc(e.course) +
                        "</td><td>" + esc(e.room) + "</td></tr>";
                }).join("");
                document.getElementById("empty").hidden = data.entries.length > 0;
            } catch (err) {
                info.textContent = "Server se connect nahi ho paya. Backend chalu hai?";
            }
        }

        loadTimetable();
    </script>
</body>
</html>
