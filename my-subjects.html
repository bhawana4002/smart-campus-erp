<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Subjects | Smart Campus ERP</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body data-role="faculty">
    <div class="dashboard-container">

        <div id="sidebar"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>My Subjects</h1>
                    <p>Aapke subjects, students aur attendance ka saar</p>
                </div>
                <div class="profile" id="userName">Faculty</div>
            </header>

            <section class="section">
                <h2>Mere subjects</h2>
                <table>
                    <thead>
                        <tr><th>Subject</th><th>Course</th><th>Students</th><th>Hafte me classes</th><th>Ab tak classes li</th><th>Avg attendance</th></tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
                <p class="empty" id="empty" hidden>Abhi aapko koi subject assign nahi hua hai. Admin se baat karo.</p>
                <p id="info"></p>
                <button class="action-button" onclick="location.href='mark-attendance.html'">Attendance lagao</button>
            </section>

        </main>
    </div>

    <script src="layout.js"></script>
    <script>
        function esc(t) {
            const d = document.createElement("div");
            d.textContent = t;
            return d.innerHTML;
        }

        async function loadSubjects() {
            const info = document.getElementById("info");
            try {
                const res = await fetch("http://127.0.0.1:5001/api/my/subjects-detail", {
                    headers: { "Authorization": "Bearer " + localStorage.getItem("erpToken") }
                });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const data = await res.json();
                if (!data.ok) {
                    info.textContent = data.message;
                    return;
                }

                document.getElementById("rows").innerHTML = data.subjects.map(function (s) {
                    const low = s.avg_attendance !== null && s.avg_attendance < data.low_limit;
                    const style = low ? ' style="color:#dc2626"' : "";
                    const avg = s.avg_attendance === null ? "-" : s.avg_attendance + "%";
                    return "<tr><td>" + esc(s.subject) + "</td><td>" + esc(s.course) + "</td><td>" + s.students +
                        "</td><td>" + s.weekly_classes + "</td><td>" + s.classes_held + "</td><td" + style +
                        "><b>" + avg + "</b></td></tr>";
                }).join("");
                document.getElementById("empty").hidden = data.subjects.length > 0;
            } catch (err) {
                info.textContent = "Server se connect nahi ho paya. Backend chalu hai?";
            }
        }

        loadSubjects();
    </script>
</body>
</html>
