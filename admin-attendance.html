<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | Smart Campus ERP</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body data-role="admin">
    <div class="dashboard-container">

        <div id="sidebar"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>Attendance</h1>
                    <p>Subject-wise attendance dekho (75% se kam lal rang me)</p>
                </div>
                <div class="profile" id="userName">Admin</div>
            </header>

            <section class="section">
                <h2>Saare subjects</h2>
                <table>
                    <thead>
                        <tr><th>Subject</th><th>Course</th><th>Faculty</th><th>Students</th><th>Classes li</th><th>Avg attendance</th><th></th></tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
                <p class="empty" id="empty" hidden>Abhi koi subject assign nahi hai.</p>
                <p id="info"></p>
            </section>

            <section class="section" id="detailSection" hidden>
                <h2 id="detailTitle">Students</h2>
                <table>
                    <thead>
                        <tr><th>Roll No</th><th>Name</th><th>Total classes</th><th>Attended</th><th>Percentage</th></tr>
                    </thead>
                    <tbody id="detailRows"></tbody>
                </table>
                <p class="empty" id="detailEmpty" hidden>Is course me abhi koi student nahi hai.</p>
            </section>

        </main>
    </div>

    <script src="layout.js"></script>
    <script>
        const BASE = "http://127.0.0.1:5001/api";
        const info = document.getElementById("info");

        function authHeaders() {
            return { "Authorization": "Bearer " + localStorage.getItem("erpToken") };
        }

        function esc(t) {
            const d = document.createElement("div");
            d.textContent = t;
            return d.innerHTML;
        }

        async function loadOverview() {
            try {
                const res = await fetch(BASE + "/attendance/overview", { headers: authHeaders() });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const data = await res.json();

                document.getElementById("rows").innerHTML = data.subjects.map(function (s) {
                    const low = s.avg_attendance !== null && s.avg_attendance < data.low_limit;
                    const style = low ? ' style="color:#dc2626"' : "";
                    const avg = s.avg_attendance === null ? "-" : s.avg_attendance + "%";
                    return "<tr><td>" + esc(s.subject) + "</td><td>" + esc(s.course) + "</td><td>" +
                        esc(s.faculty_name) + "</td><td>" + s.students + "</td><td>" + s.classes_held +
                        "</td><td" + style + "><b>" + avg + '</b></td><td><button class="action-button" ' +
                        'style="margin-top:0" onclick="showDetail(' + s.id + ')">Students dekho</button></td></tr>';
                }).join("");
                document.getElementById("empty").hidden = data.subjects.length > 0;
            } catch (err) {
                info.textContent = "Server se connect nahi ho paya. Backend chalu hai?";
            }
        }

        async function showDetail(id) {
            try {
                const res = await fetch(BASE + "/attendance/subject/" + id, { headers: authHeaders() });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const data = await res.json();
                if (!data.ok) {
                    info.textContent = data.message;
                    return;
                }

                document.getElementById("detailTitle").textContent = data.subject + " - " + data.course;
                document.getElementById("detailRows").innerHTML = data.students.map(function (s) {
                    const low = s.percent !== null && s.percent < data.low_limit;
                    const style = low ? ' style="color:#dc2626"' : "";
                    const pct = s.percent === null ? "-" : s.percent + "%";
                    return "<tr><td>" + esc(s.roll) + "</td><td>" + esc(s.name) + "</td><td>" + s.total +
                        "</td><td>" + s.attended + "</td><td" + style + "><b>" + pct + "</b></td></tr>";
                }).join("");
                document.getElementById("detailEmpty").hidden = data.students.length > 0;
                document.getElementById("detailSection").hidden = false;
                document.getElementById("detailSection").scrollIntoView({ behavior: "smooth" });
            } catch (err) {
                info.textContent = "Server se connect nahi ho paya. Backend chalu hai?";
            }
        }

        loadOverview();
    </script>
</body>
</html>
