<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance | Smart Campus ERP</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body data-role="student">
    <div class="dashboard-container">

        <div id="sidebar"></div>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>My Attendance</h1>
                    <p>Subject-wise attendance yaha dekho</p>
                </div>
                <div class="profile" id="userName">Student</div>
            </header>

            <section class="cards">
                <div class="dashboard-card">
                    <h3>Overall Attendance</h3>
                    <p class="number" id="overall">-</p>
                    <span>Saare subjects milake</span>
                </div>
            </section>

            <section class="section">
                <h2>Subject-wise</h2>
                <table>
                    <thead>
                        <tr><th>Subject</th><th>Total Classes</th><th>Attended</th><th>Percentage</th><th>Status</th></tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
                <p class="empty" id="empty" hidden>Abhi koi attendance record nahi hai.</p>
                <p id="info"></p>
            </section>

        </main>
    </div>

    <script src="layout.js"></script>
    <script>
        function esc(t) {
            const d = document.createElement("div");
            d.textContent = t;
            return d.innerHTML;
        }

        async function loadAttendance() {
            const info = document.getElementById("info");
            try {
                const res = await fetch("http://127.0.0.1:5001/api/my/attendance", {
                    headers: { "Authorization": "Bearer " + localStorage.getItem("erpToken") }
                });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const data = await res.json();
                if (!data.ok) {
                    info.textContent = data.message;
                    return;
                }

                document.getElementById("overall").textContent = data.overall + "%";
                document.getElementById("empty").hidden = data.subjects.length > 0;

                document.getElementById("rows").innerHTML = data.subjects.map(function (s) {
                    const low = s.percent < 75;
                    const color = low ? "#dc2626" : "#16a34a";
                    const status = low ? "Kam hai (75% se neeche)" : "Theek hai";
                    return "<tr><td>" + esc(s.subject) + "</td><td>" + s.total + "</td><td>" + s.attended +
                        "</td><td><b>" + s.percent + '%</b></td><td style="color:' + color + '">' + status + "</td></tr>";
                }).join("");
            } catch (err) {
                info.textContent = "Server se connect nahi ho paya. Backend chalu hai?";
            }
        }

        loadAttendance();
    </script>
</body>
</html>
